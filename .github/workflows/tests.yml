name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
        include:
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned ripgrep for native read tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ripgrep-14.1.1.zip'
          Invoke-WebRequest 'https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-pc-windows-msvc.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd0f534024c42afd6cb4d38907c25cd2b249b79bbe6cc1dbee8e3e37c2b6e25a1') { throw 'ripgrep archive checksum mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'shunt-ripgrep'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $binary = Get-ChildItem -LiteralPath $destination -Filter rg.exe -Recurse | Select-Object -First 1
          if (-not $binary) { throw 'ripgrep executable missing' }
          $binary.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src
  windows-sandbox:
    name: Real Windows sandbox (unelevated, Codex 0.154.0)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install pinned Codex and sandbox helpers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $env:RUNNER_TEMP 'shunt-codex'
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          $archive = Join-Path $runtime 'codex-x86_64-pc-windows-msvc.exe.zip'
          Invoke-WebRequest 'https://github.com/openai/codex/releases/download/rust-v0.154.0/codex-x86_64-pc-windows-msvc.exe.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '53685f9f6bd171d4bd7d6c2be724fc04f6737a4001eb8471ec59824e5adc8042') { throw 'Codex archive checksum mismatch' }
          $expanded = Join-Path $runtime 'bundle'
          Expand-Archive $archive -DestinationPath $expanded
          $assets = @(
            @{ Name = 'codex-x86_64-pc-windows-msvc.exe'; Target = 'codex.exe' },
            @{ Name = 'codex-command-runner.exe'; Target = 'codex-command-runner.exe' },
            @{ Name = 'codex-windows-sandbox-setup.exe'; Target = 'codex-windows-sandbox-setup.exe' }
          )
          $executables = @(Get-ChildItem $expanded -Recurse -Filter '*.exe' -File)
          if ($executables.Count -ne $assets.Count) { throw 'Unexpected Codex archive layout' }
          foreach ($asset in $assets) {
            $source = Join-Path $expanded $asset.Name
            if (-not (Test-Path $source -PathType Leaf)) { throw 'Missing expected Codex executable' }
            Copy-Item $source (Join-Path $runtime $asset.Target)
          }
          "CODEX_SHUNT_TEST_CODEX_PATH=$(Join-Path $runtime 'codex.exe')" >> $env:GITHUB_ENV
          'CODEX_SHUNT_TEST_SANDBOX_MODE=unelevated' >> $env:GITHUB_ENV
          Write-Output 'Testing unelevated; elevated and MXC are not provisioned on this runner.'
      - name: Exercise real CLM and read-only sandbox without authentication
        run: python -m unittest discover -s tests -p test_windows_sandbox.py -v
